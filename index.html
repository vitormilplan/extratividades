<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Demandas - Importação/Exportação</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS para manipular planilhas Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Ícones Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Estilização suave para inputs editáveis na tabela */
    .table-input {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 0.375rem;
      padding: 0.25rem 0.5rem;
      transition: all 0.2s;
    }
    .table-input:hover {
      background-color: rgba(243, 244, 246, 1);
      border-color: #d1d5db;
    }
    .table-input:focus {
      background-color: #ffffff;
      border-color: #3b82f6;
      outline: none;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }
    /* Destaque para campos pendentes de preenchimento */
    .field-empty {
      background-color: #fef2f2 !important;
      border-color: #fca5a5 !important;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Header -->
  <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <i data-lucide="clipboard-list" class="w-8 h-8 text-indigo-300"></i>
        <div>
          <h1 class="text-xl font-bold tracking-wide">Gestão de Demandas</h1>
          <p class="text-xs text-indigo-200">Importação, Exportação e Edição em Massa</p>
        </div>
      </div>

      <!-- Ações principais -->
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="downloadTemplate()" class="bg-indigo-800 hover:bg-indigo-700 text-white text-xs md:text-sm px-3 py-2 rounded-lg flex items-center gap-2 transition">
          <i data-lucide="file-down" class="w-4 h-4"></i> Modelo Excel
        </button>
        <button onclick="document.getElementById('excelInput').click()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs md:text-sm px-3 py-2 rounded-lg flex items-center gap-2 transition font-medium shadow">
          <i data-lucide="upload" class="w-4 h-4"></i> Importar Planilha
        </button>
        <input type="file" id="excelInput" accept=".xlsx, .xls, .csv" class="hidden" onchange="importExcel(event)">
        
        <button onclick="exportToExcel()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs md:text-sm px-3 py-2 rounded-lg flex items-center gap-2 transition font-medium shadow">
          <i data-lucide="download" class="w-4 h-4"></i> Exportar
        </button>
        <button onclick="addDemand()" class="bg-amber-500 hover:bg-amber-400 text-slate-900 text-xs md:text-sm px-3 py-2 rounded-lg flex items-center gap-2 transition font-bold shadow">
          <i data-lucide="plus" class="w-4 h-4"></i> Nova Demanda
        </button>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-7xl mx-auto px-4 py-6">

    <!-- Cards de Resumo -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 uppercase font-semibold">Total de Demandas</p>
          <p id="totalCount" class="text-2xl font-bold text-slate-800">0</p>
        </div>
        <div class="bg-slate-100 p-3 rounded-lg text-slate-600">
          <i data-lucide="layers" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs text-amber-600 uppercase font-semibold">Pendentes (Incompletas)</p>
          <p id="pendingCount" class="text-2xl font-bold text-amber-600">0</p>
        </div>
        <div class="bg-amber-50 p-3 rounded-lg text-amber-600">
          <i data-lucide="alert-circle" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs text-emerald-600 uppercase font-semibold">Concluídas (Completas)</p>
          <p id="completedCount" class="text-2xl font-bold text-emerald-600">0</p>
        </div>
        <div class="bg-emerald-50 p-3 rounded-lg text-emerald-600">
          <i data-lucide="check-circle-2" class="w-6 h-6"></i>
        </div>
      </div>
    </div>

    <!-- Barra de Filtro e Busca -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
      <div class="relative w-full md:w-80">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
        <input type="text" id="searchInput" oninput="renderTable()" placeholder="Buscar por código, setor, responsável..." class="w-full pl-9 pr-4 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:border-indigo-500">
      </div>

      <div class="flex items-center gap-2 w-full md:w-auto">
        <label class="text-xs font-semibold text-slate-500">Filtrar por Status:</label>
        <select id="statusFilter" onchange="renderTable()" class="text-sm border border-slate-300 rounded-lg px-3 py-2 bg-white focus:outline-none focus:border-indigo-500">
          <option value="TODOS">Todos os Status</option>
          <option value="PENDENTE">Apenas Pendentes</option>
          <option value="CONCLUIDO">Apenas Concluídos</option>
        </select>
      </div>
    </div>

    <!-- Tabela de Demandas -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
      <table class="w-full text-left text-xs md:text-sm border-collapse">
        <thead class="bg-slate-100 text-slate-700 uppercase font-semibold text-[11px] tracking-wider border-b border-slate-200">
          <tr>
            <th class="p-3">Código</th>
            <th class="p-3 min-w-[200px]">Descrição da Tarefa</th>
            <th class="p-3">Tipo</th>
            <th class="p-3">Solicitante</th>
            <th class="p-3">Responsável</th>
            <th class="p-3">Resp. Resposta</th>
            <th class="p-3">Data Chegada</th>
            <th class="p-3">Data Finalização</th>
            <th class="p-3 text-center">Tempo (h)</th>
            <th class="p-3 text-center">Status</th>
            <th class="p-3 text-center">Ações</th>
          </tr>
        </thead>
        <tbody id="demandsTableBody" class="divide-y divide-slate-200">
          <!-- Linhas renderizadas via JS -->
        </tbody>
      </table>
    </div>
  </main>

  <script>
    // Inicialização do Estado
    let demandas = JSON.parse(localStorage.getItem('demands_data')) || [
      {
        id: "DEM-001",
        descricao: "Análise de não conformidade no setor de produção",
        tipo: "Qualidade",
        setorSolicitante: "Qualidade",
        setorResponsavel: "Engenharia",
        responsavelResposta: "Vitor Alves",
        dataChegada: "2026-09-01",
        dataFinalizacao: "2026-09-05",
        tempoReal: "8",
        status: "CONCLUIDO"
      },
      {
        id: "DEM-002",
        descricao: "Ajuste do procedimento de SMS para auditoria",
        tipo: "SMS",
        setorSolicitante: "Segurança",
        setorResponsavel: "Qualidade",
        responsavelResposta: "", // Faltando -> Ficará Pendente
        dataChegada: "2026-09-03",
        dataFinalizacao: "",
        tempoReal: "",
        status: "PENDENTE"
      }
    ];

    // Salvar localmente
    function saveData() {
      localStorage.setItem('demands_data', JSON.stringify(demandas));
      updateMetrics();
    }

    // Verificar se a demanda possui algum campo em branco
    function isDemandIncomplete(d) {
      return !d.id || !d.descricao || !d.tipo || !d.setorSolicitante || 
             !d.setorResponsavel || !d.responsavelResposta || 
             !d.dataChegada || !d.dataFinalizacao || !d.tempoReal;
    }

    // Atualizar Status automaticamente com base no preenchimento
    function validateAndUpdateStatus(d) {
      if (isDemandIncomplete(d)) {
        d.status = "PENDENTE";
      } else {
        d.status = "CONCLUIDO";
      }
    }

    // Renderizar a Tabela
    function renderTable() {
      const tbody = document.getElementById('demandsTableBody');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filter = document.getElementById('statusFilter').value;

      tbody.innerHTML = '';

      const filtered = demandas.filter(d => {
        const matchesSearch = 
          (d.id || '').toLowerCase().includes(search) ||
          (d.descricao || '').toLowerCase().includes(search) ||
          (d.setorSolicitante || '').toLowerCase().includes(search) ||
          (d.setorResponsavel || '').toLowerCase().includes(search) ||
          (d.responsavelResposta || '').toLowerCase().includes(search);
        
        const matchesStatus = filter === 'TODOS' || d.status === filter;

        return matchesSearch && matchesStatus;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="11" class="text-center py-8 text-slate-400">
              Nenhuma demanda encontrada.
            </td>
          </tr>`;
        updateMetrics();
        return;
      }

      filtered.forEach((d, index) => {
        validateAndUpdateStatus(d);
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 transition-colors";

        const statusBadge = d.status === 'CONCLUIDO' 
          ? `<span class="inline-flex items-center gap-1 bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-medium"><i data-lucide="check" class="w-3 h-3"></i> Concluído</span>`
          : `<span class="inline-flex items-center gap-1 bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full font-medium"><i data-lucide="clock" class="w-3 h-3"></i> Pendente</span>`;

        tr.innerHTML = `
          <td class="p-2">
            <input type="text" value="${d.id || ''}" onchange="updateField('${d.id}', 'id', this.value)" class="table-input font-semibold text-slate-700 ${!d.id ? 'field-empty' : ''}" placeholder="Cód...">
          </td>
          <td class="p-2">
            <input type="text" value="${d.descricao || ''}" onchange="updateField('${d.id}', 'descricao', this.value)" class="table-input ${!d.descricao ? 'field-empty' : ''}" placeholder="Descrição...">
          </td>
          <td class="p-2">
            <input type="text" value="${d.tipo || ''}" onchange="updateField('${d.id}', 'tipo', this.value)" class="table-input ${!d.tipo ? 'field-empty' : ''}" placeholder="Tipo...">
          </td>
          <td class="p-2">
            <input type="text" value="${d.setorSolicitante || ''}" onchange="updateField('${d.id}', 'setorSolicitante', this.value)" class="table-input ${!d.setorSolicitante ? 'field-empty' : ''}" placeholder="Solicitante...">
          </td>
          <td class="p-2">
            <input type="text" value="${d.setorResponsavel || ''}" onchange="updateField('${d.id}', 'setorResponsavel', this.value)" class="table-input ${!d.setorResponsavel ? 'field-empty' : ''}" placeholder="Responsável...">
          </td>
          <td class="p-2">
            <input type="text" value="${d.responsavelResposta || ''}" onchange="updateField('${d.id}', 'responsavelResposta', this.value)" class="table-input ${!d.responsavelResposta ? 'field-empty' : ''}" placeholder="Resp. Resposta...">
          </td>
          <td class="p-2">
            <input type="date" value="${d.dataChegada || ''}" onchange="updateField('${d.id}', 'dataChegada', this.value)" class="table-input ${!d.dataChegada ? 'field-empty' : ''}">
          </td>
          <td class="p-2">
            <input type="date" value="${d.dataFinalizacao || ''}" onchange="updateField('${d.id}', 'dataFinalizacao', this.value)" class="table-input ${!d.dataFinalizacao ? 'field-empty' : ''}">
          </td>
          <td class="p-2">
            <input type="number" step="0.5" value="${d.tempoReal || ''}" onchange="updateField('${d.id}', 'tempoReal', this.value)" class="table-input text-center ${!d.tempoReal ? 'field-empty' : ''}" placeholder="Horas">
          </td>
          <td class="p-2 text-center">
            ${statusBadge}
          </td>
          <td class="p-2 text-center">
            <button onclick="deleteDemand('${d.id}')" class="text-slate-400 hover:text-red-600 transition p-1" title="Excluir">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </td>
        `;

        tbody.appendChild(tr);
      });

      lucide.createIcons();
      updateMetrics();
    }

    // Atualizar campo inline diretamente da tabela
    function updateField(id, field, value) {
      const item = demandas.find(d => d.id === id);
      if (item) {
        item[field] = value.trim();
        validateAndUpdateStatus(item);
        saveData();
        renderTable();
      }
    }

    // Adicionar nova demanda manual
    function addDemand() {
      const newId = `DEM-${String(demandas.length + 1).padStart(3, '0')}`;
      demandas.unshift({
        id: newId,
        descricao: "",
        tipo: "",
        setorSolicitante: "",
        setorResponsavel: "",
        responsavelResposta: "",
        dataChegada: new Date().toISOString().split('T')[0],
        dataFinalizacao: "",
        tempoReal: "",
        status: "PENDENTE"
      });
      saveData();
      renderTable();
    }

    // Deletar demanda
    function deleteDemand(id) {
      if (confirm(`Deseja realmente remover a demanda ${id}?`)) {
        demandas = demandas.filter(d => d.id !== id);
        saveData();
        renderTable();
      }
    }

    // Atualizar métricas nos cards
    function updateMetrics() {
      document.getElementById('totalCount').innerText = demandas.length;
      document.getElementById('pendingCount').innerText = demandas.filter(d => d.status === 'PENDENTE').length;
      document.getElementById('completedCount').innerText = demandas.filter(d => d.status === 'CONCLUIDO').length;
    }

    // EXPORTAR PARA EXCEL
    function exportToExcel() {
      const dataToExport = demandas.map(d => ({
        "Código": d.id,
        "Descrição da Tarefa": d.descricao,
        "Tipo de Demanda": d.tipo,
        "Setor Solicitante": d.setorSolicitante,
        "Setor Responsável": d.setorResponsavel,
        "Responsável pela Resposta": d.responsavelResposta,
        "Data de Chegada": d.dataChegada,
        "Data de Finalização": d.dataFinalizacao,
        "Tempo Real (h)": d.tempoReal,
        "Status": d.status
      }));

      const worksheet = XLSX.utils.json_to_sheet(dataToExport);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Demandas");

      XLSX.writeFile(workbook, `Gestao_de_Demandas_${new Date().toISOString().split('T')[0]}.xlsx`);
    }

    // BAIXAR MODELO EXCEL
    function downloadTemplate() {
      const templateData = [
        {
          "Código": "DEM-101",
          "Descrição da Tarefa": "Exemplo de tarefa de auditoria",
          "Tipo de Demanda": "Melhoria",
          "Setor Solicitante": "Qualidade",
          "Setor Responsável": "Engenharia",
          "Responsável pela Resposta": "João Silva",
          "Data de Chegada": "2026-09-01",
          "Data de Finalização": "2026-09-02",
          "Tempo Real (h)": "4"
        },
        {
          "Código": "DEM-102",
          "Descrição da Tarefa": "Exemplo de tarefa incompleta",
          "Tipo de Demanda": "Manutenção",
          "Setor Solicitante": "Operações",
          "Setor Responsável": "SMS",
          "Responsável pela Resposta": "",
          "Data de Chegada": "2026-09-02",
          "Data de Finalização": "",
          "Tempo Real (h)": ""
        }
      ];

      const worksheet = XLSX.utils.json_to_sheet(templateData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Modelo");

      XLSX.writeFile(workbook, "Modelo_Importacao_Demandas.xlsx");
    }

    // IMPORTAR DO EXCEL
    function importExcel(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const jsonData = XLSX.utils.sheet_to_json(firstSheet);

        if (jsonData.length === 0) {
          alert('Nenhum dado encontrado na planilha.');
          return;
        }

        let importedCount = 0;

        jsonData.forEach(row => {
          // Mapeamento flexível de colunas
          const item = {
            id: String(row['Código'] || row['Codigo'] || row['ID'] || `DEM-${Date.now()}`).trim(),
            descricao: String(row['Descrição da Tarefa'] || row['Descrição'] || row['Descricao'] || '').trim(),
            tipo: String(row['Tipo de Demanda'] || row['Tipo'] || '').trim(),
            setorSolicitante: String(row['Setor Solicitante'] || row['Solicitante'] || '').trim(),
            setorResponsavel: String(row['Setor Responsável'] || row['Setor Responsavel'] || row['Responsável'] || '').trim(),
            responsavelResposta: String(row['Responsável pela Resposta'] || row['Responsavel Resposta'] || '').trim(),
            dataChegada: String(row['Data de Chegada'] || row['Data Chegada'] || '').trim(),
            dataFinalizacao: String(row['Data de Finalização'] || row['Data Finalizacao'] || '').trim(),
            tempoReal: String(row['Tempo Real (h)'] || row['Tempo Real'] || row['Tempo'] || '').trim(),
            status: "PENDENTE"
          };

          validateAndUpdateStatus(item);

          // Atualizar se já existir ou inserir se for novo
          const existingIndex = demandas.findIndex(d => d.id === item.id);
          if (existingIndex >= 0) {
            demandas[existingIndex] = item;
          } else {
            demandas.unshift(item);
          }
          importedCount++;
        });

        saveData();
        renderTable();
        alert(`${importedCount} demanda(s) importada(s) ou atualizada(s) com sucesso!`);
        event.target.value = ''; // Reset input
      };

      reader.readAsArrayBuffer(file);
    }

    // Inicialização ao carregar a página
    document.addEventListener('DOMContentLoaded', () => {
      renderTable();
    });
  </script>
</body>
</html>
