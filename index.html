<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Demandas — Milplan</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --navy-900:#0b1c33; --navy-800:#122c4f; --navy-700:#193a66;
  --red-600:#a83232; --gold-500:#e0a83e; --blue-400:#5b8fc9;
  --bg:#eef1f5; --card:#ffffff; --text-dark:#1b2430;
  --text-muted:#6b7480; --border:#e1e5eb; --green-ok:#2f8f5b;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text-dark);
  font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{
  font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.02em;
}
.app{max-width:1280px; margin:0 auto; padding:0 0 60px;}

/* HEADER */
.header{
  background:linear-gradient(135deg,var(--navy-900),var(--navy-800));
  border-bottom:4px solid var(--red-600);
  padding:22px 28px; display:flex; align-items:center; gap:16px;
}
.brand-mark{
  height:54px; display:flex; align-items:center; justify-content:center;
  background:#fff; border-radius:8px; padding:6px 12px;
}
.brand-mark img{height:100%; width:auto; object-fit:contain;}
.brand-text h1{color:#fff; font-size:24px; margin:0; font-weight:700;}
.brand-text .sub{color:#a9bcd6; font-size:12px; letter-spacing:.12em; text-transform:uppercase; margin-top:2px;}

/* CONTROLS */
.controls{
  background:var(--card); margin:20px 28px 0; border-radius:12px;
  border:1px solid var(--border); padding:16px 20px; display:flex; gap:10px; flex-wrap:wrap;
}
.tabbtn{
  font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
  padding:9px 16px; border-radius:8px; border:1.5px solid var(--border);
  background:#fff; color:var(--text-muted); cursor:pointer;
}
.tabbtn.active{background:var(--navy-800); color:#fff; border-color:var(--navy-800);}

/* SECTIONS & CARDS */
.section{margin:22px 28px 0;}
.section-title{
  font-size:20px; font-weight:700; color:var(--navy-900);
  display:flex; align-items:center; gap:10px; margin-bottom:12px;
}
.section-title .bar{width:4px; height:18px; background:var(--red-600); border-radius:2px;}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:12px;
  padding:20px; box-shadow:0 1px 3px rgba(15,30,55,.04); margin-bottom:20px;
}

/* FORMULÁRIO GRID */
.form-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px;
}
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); font-weight:700;}
.input-text, select{
  font-family:'Inter',sans-serif; font-size:13px; padding:9px 12px;
  border-radius:8px; border:1.5px solid var(--border); background:#fff; color:var(--text-dark); width:100%;
}
.btn-submit{
  background:var(--green-ok); color:#fff; border:none; padding:10px 20px;
  border-radius:8px; font-weight:700; font-size:13px; cursor:pointer; margin-top:16px;
}
.btn-submit:hover{background:#257348;}
.btn-delete{
  background:#fdeceb; color:var(--red-600); border:1px solid #f0b8b0;
  padding:6px 10px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer;
}
.btn-add{
  background:var(--navy-800); color:#fff; border:none; padding:9px 12px;
  border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
}
.btn-outline{
  background:#fff; color:var(--text-muted); border:1px solid var(--border);
  padding:6px 10px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer;
}
.btn-outline:hover{background:#f5f7fa;}

/* CONFIG LISTS */
.config-list{
  list-style:none; padding:0; margin:16px 0 0 0;
}
.config-list li{
  display:flex; justify-content:space-between; align-items:center;
  padding:8px 12px; border-bottom:1px solid #f0f2f5; font-size:13px;
}
.config-list li:hover{background:#fafbfc;}

/* TABELA */
.data-table{width:100%; border-collapse:collapse; font-size:13px;}
.data-table th{
  background:var(--navy-800); color:#fff; text-align:left; padding:9px 12px; font-weight:700; font-size:11.5px;
}
.data-table td{padding:9px 12px; border-bottom:1px solid #f0f2f5; vertical-align:middle;}
.data-table tr:hover td{background:#fafbfc;}
.badge-pendente{
  background:#fff8ea; color:#c78a1e; border:1px solid #f0d99a; 
  padding:3px 6px; border-radius:4px; font-size:11px; font-weight:700;
}

/* GRÁFICOS */
.charts-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(400px, 1fr)); gap:20px;
}
.chart-container{
  background:#fff; border:1px solid var(--border); border-radius:12px; padding:20px;
  position:relative; height:300px;
}
.chart-container.full-width{
  grid-column: 1 / -1; height:350px;
}
.chart-title{font-size:14px; font-weight:700; color:var(--navy-900); text-align:center; margin-bottom:10px;}

/* MODAL FINALIZAR */
.modal-overlay{
  display:none; position:fixed; inset:0; background:rgba(10,18,36,.55);
  z-index:1000; align-items:center; justify-content:center; padding:20px;
}
.modal-box{
  background:#fff; border-radius:14px; max-width:400px; width:100%;
  padding:26px 28px; box-shadow:0 20px 60px rgba(0,0,0,.35);
}

</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="brand-mark">
      <img src="COLE_AQUI_O_LOGO_BASE64_ORIGINAL" alt="Milplan">
    </div>
    <div class="brand-text">
      <h1>Registro de Demandas Extra</h1>
      <div class="sub">Milplan Engenharia · QSMS Qualidade · Painel de Acompanhamento</div>
    </div>
  </div>

  <div class="controls">
    <button class="tabbtn active" data-tab="registro">Registrar & Consultar</button>
    <button class="tabbtn" data-tab="dashboard">Dashboard & Gráficos</button>
    <button class="tabbtn" data-tab="config">⚙️ Parâmetros</button>
  </div>

  <div id="content"></div>
</div>

<!-- Modal para Editar/Finalizar Demanda -->
<div id="modalFinalizar" class="modal-overlay">
  <div class="modal-box" style="max-width:560px;">
    <h3 style="margin-top:0; color:var(--navy-800); font-size:18px; margin-bottom:16px;">Editar Demanda</h3>
    <form id="formFinalizar">
      <div class="form-grid" style="margin-bottom:12px;">
        <div class="field">
          <label>Código</label>
          <input type="text" id="modCodigo" class="input-text" required>
        </div>
        <div class="field">
          <label>Descrição</label>
          <input type="text" id="modNome" class="input-text" required>
        </div>
        <div class="field">
          <label>Tipo de Demanda</label>
          <select id="modTipo" required></select>
        </div>
        <div class="field">
          <label>Setor Solicitante</label>
          <select id="modSetorSolicitante" required></select>
        </div>
        <div class="field">
          <label>Setor Responsável</label>
          <select id="modSetorResponsavel" required></select>
        </div>
        <div class="field">
          <label>Data de Chegada</label>
          <input type="date" id="modDataChegada" class="input-text" required>
        </div>
      </div>
      <hr style="border:none; border-top:1px solid var(--border); margin:16px 0;">
      <div style="font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); font-weight:700; margin-bottom:10px;">
        Finalização (opcional — deixe em branco para manter Pendente)
      </div>
      <div class="form-grid" style="margin-bottom:20px;">
        <div class="field">
          <label>Responsável pela Resposta</label>
          <select id="modResponsavel"><option value="">— não definido —</option></select>
        </div>
        <div class="field">
          <label>Data de Finalização</label>
          <input type="date" id="modDataFim" class="input-text">
        </div>
        <div class="field">
          <label>Tempo Despendido (h)</label>
          <input type="number" id="modTempo" class="input-text" min="0" step="0.5">
        </div>
      </div>
      <div style="display:flex; justify-content:space-between; gap:10px;">
        <button type="button" class="btn-delete" style="padding:9px 16px;" onclick="excluirDoModal()">Excluir Demanda</button>
        <div style="display:flex; gap:10px;">
          <button type="button" class="btn-outline" onclick="fecharModal()">Cancelar</button>
          <button type="submit" class="btn-submit" style="margin:0;">Salvar</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
// ---------- ESTADO DA APLICAÇÃO ----------
let STATE = { 
  demandas: [],
  tipos: [],
  setoresSolicitantes: [],
  setoresResponsaveis: [],
  responsaveis: []
};
let currentTab = 'registro';
let demandaEditando = null;
let charts = {};

function loadState() {
  const saved = localStorage.getItem('milplan_demandas_v3');
  if (saved) {
    STATE = JSON.parse(saved);
  } else {
    STATE.demandas = [
      { id: '1', codigo: 'REQ-001', nome: 'Análise de soldagem TIG', tipo: 'Análise de Documentação', setorSolicitante: 'Engenharia', setorResponsavel: 'Qualidade', responsavel: 'Vitor Hugo', dataChegada: '2026-08-01', dataFim: '2026-08-02', tempoGasto: 4 },
      { id: '2', codigo: 'REQ-002', nome: 'Levantamento de escopo PPP', tipo: 'PPPs', setorSolicitante: 'RH', setorResponsavel: 'Segurança', responsavel: '', dataChegada: '2026-09-02', dataFim: '', tempoGasto: null }
    ];
    STATE.tipos = ['Análise de Documentação', 'PPPs', 'Orçamentos', 'Auditoria'];
    STATE.setoresSolicitantes = ['Engenharia', 'RH', 'Manutenção', 'Suprimentos'];
    STATE.setoresResponsaveis = ['Qualidade', 'Segurança', 'Meio Ambiente'];
    STATE.responsaveis = ['Vitor Hugo', 'Carlos', 'Ana'];
    saveState();
  }
}

function saveState() {
  localStorage.setItem('milplan_demandas_v3', JSON.stringify(STATE));
}

const contentEl = document.getElementById('content');

function render() {
  Object.values(charts).forEach(c => c.destroy());
  charts = {};

  document.querySelectorAll('.tabbtn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === currentTab);
  });

  if (currentTab === 'registro') renderRegistroTab();
  else if (currentTab === 'dashboard') renderDashboardTab();
  else if (currentTab === 'config') renderConfigTab();
}

// ---------- ABA 1: REGISTRO ----------
function renderRegistroTab() {
  const getOptions = (arr) => arr.map(i => `<option value="${i}">${i}</option>`).join('');

  contentEl.innerHTML = `
    <div class="section">
      <div class="section-title"><span class="bar"></span>Nova Demanda</div>
      <div class="card">
        <form id="demandaForm">
          <div class="form-grid">
            <div class="field"><label>Código</label><input type="text" id="inpCodigo" class="input-text" placeholder="Ex: REQ-045" required></div>
            <div class="field"><label>Descrição</label><input type="text" id="inpNome" class="input-text" placeholder="O que foi solicitado..." required></div>
            <div class="field"><label>Tipo de Demanda</label><select id="inpTipo" required><option value="">Selecione...</option>${getOptions(STATE.tipos)}</select></div>
            <div class="field"><label>Setor Solicitante</label><select id="inpSetorSolicitante" required><option value="">Selecione...</option>${getOptions(STATE.setoresSolicitantes)}</select></div>
            <div class="field"><label>Setor Responsável</label><select id="inpSetorResponsavel" required><option value="">Selecione...</option>${getOptions(STATE.setoresResponsaveis)}</select></div>
            <div class="field"><label>Data de Chegada</label><input type="date" id="inpDataChegada" class="input-text" required></div>
          </div>
          <button type="submit" class="btn-submit">Cadastrar Demanda</button>
        </form>
      </div>

      <div class="section-title"><span class="bar"></span>Importar / Exportar Planilha</div>
      <div class="card" style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
        <button class="btn-add" onclick="exportarPlanilha()">📥 Exportar Planilha (.xlsx)</button>
        <button class="btn-add" onclick="document.getElementById('inputImportar').click()">📤 Importar Planilha (.xlsx)</button>
        <input type="file" id="inputImportar" accept=".xlsx,.xls" style="display:none" onchange="importarPlanilha(event)">
        <span style="font-size:12px; color:var(--text-muted); flex:1; min-width:220px;">
          Colunas esperadas: <b>Código, Nome, Tipo, Setor Solicitante, Setor Responsável, Responsável, Data Chegada, Data Fim, Tempo Gasto (h)</b>.
          Se "Responsável", "Data Fim" ou "Tempo Gasto" ficarem em branco, a demanda entra como <b>Pendente</b> e pode ser finalizada/editada direto na tabela abaixo.
          Se o <b>Código</b> já existir, a demanda existente é atualizada; se não existir, uma nova é criada.
        </span>
      </div>

      <div class="section-title"><span class="bar"></span>Demandas Registradas</div>
      <div class="card" style="overflow-x:auto;">
        <table class="data-table">
          <thead>
            <tr>
              <th>Código</th><th>Nome</th><th>Tipo</th><th>Solicitante</th><th>Setor Resp.</th>
              <th>Pessoa Resp.</th><th>Chegada</th><th>Finalização</th><th>Tempo (h)</th><th>Ações</th>
            </tr>
          </thead>
          <tbody>
            ${STATE.demandas.length === 0 ? '<tr><td colspan="10" style="text-align:center; color:var(--text-muted);">Nenhuma demanda.</td></tr>' : ''}
            ${STATE.demandas.slice().reverse().map(d => {
              const isPendente = !d.dataFim || d.tempoGasto === null || d.tempoGasto === "";
              return `
              <tr>
                <td><b>${d.codigo}</b></td>
                <td>${d.nome}</td>
                <td>${d.tipo}</td>
                <td>${d.setorSolicitante}</td>
                <td>${d.setorResponsavel}</td>
                <td>${d.responsavel ? d.responsavel : '<span class="badge-pendente">PENDENTE</span>'}</td>
                <td>${formatDate(d.dataChegada)}</td>
                <td>${!isPendente ? formatDate(d.dataFim) : '-'}</td>
                <td>${!isPendente ? d.tempoGasto + 'h' : '-'}</td>
                <td>
                  <div style="display:flex; gap:6px;">
                    ${isPendente 
                      ? `<button class="btn-submit" style="margin:0; padding:6px 10px; font-size:11.5px;" onclick="abrirModal('${d.id}')">Finalizar</button>` 
                      : `<button class="btn-outline" style="margin:0; padding:6px 10px; font-size:11.5px;" onclick="abrirModal('${d.id}')">Editar</button>`}
                    <button class="btn-delete" onclick="deleteDemanda('${d.id}')">Excluir</button>
                  </div>
                </td>
              </tr>
            `}).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  document.getElementById('demandaForm').onsubmit = function(e) {
    e.preventDefault();
    const novaDemanda = {
      id: Math.random().toString(36).substr(2, 9),
      codigo: document.getElementById('inpCodigo').value.trim(),
      nome: document.getElementById('inpNome').value.trim(),
      tipo: document.getElementById('inpTipo').value,
      setorSolicitante: document.getElementById('inpSetorSolicitante').value,
      setorResponsavel: document.getElementById('inpSetorResponsavel').value,
      dataChegada: document.getElementById('inpDataChegada').value,
      responsavel: "", 
      dataFim: "",     
      tempoGasto: null 
    };
    STATE.demandas.push(novaDemanda);
    saveState();
    render();
  };
}

window.abrirModal = function(id) {
  demandaEditando = STATE.demandas.find(d => d.id === id);
  if(!demandaEditando) return;

  const getOptions = (arr) => arr.map(i => `<option value="${i}">${i}</option>`).join('');

  // Campos principais
  document.getElementById('modCodigo').value = demandaEditando.codigo || '';
  document.getElementById('modNome').value = demandaEditando.nome || '';
  document.getElementById('modDataChegada').value = demandaEditando.dataChegada || '';

  const selectTipo = document.getElementById('modTipo');
  selectTipo.innerHTML = '<option value="">Selecione...</option>' + getOptions(STATE.tipos);
  selectTipo.value = demandaEditando.tipo || '';

  const selectSetorSol = document.getElementById('modSetorSolicitante');
  selectSetorSol.innerHTML = '<option value="">Selecione...</option>' + getOptions(STATE.setoresSolicitantes);
  selectSetorSol.value = demandaEditando.setorSolicitante || '';

  const selectSetorResp = document.getElementById('modSetorResponsavel');
  selectSetorResp.innerHTML = '<option value="">Selecione...</option>' + getOptions(STATE.setoresResponsaveis);
  selectSetorResp.value = demandaEditando.setorResponsavel || '';

  // Campos de finalização
  const selectResp = document.getElementById('modResponsavel');
  selectResp.innerHTML = '<option value="">— não definido —</option>' + getOptions(STATE.responsaveis);
  selectResp.value = demandaEditando.responsavel || '';

  document.getElementById('modDataFim').value = demandaEditando.dataFim || '';
  document.getElementById('modTempo').value = (demandaEditando.tempoGasto !== null && demandaEditando.tempoGasto !== undefined) ? demandaEditando.tempoGasto : '';

  document.getElementById('modalFinalizar').style.display = 'flex';
}

window.excluirDoModal = function() {
  if(!demandaEditando) return;
  if(confirm(`Excluir a demanda "${demandaEditando.codigo}"?`)) {
    STATE.demandas = STATE.demandas.filter(d => d.id !== demandaEditando.id);
    saveState();
    fecharModal();
    render();
  }
}

window.fecharModal = function() {
  document.getElementById('modalFinalizar').style.display = 'none';
  demandaEditando = null;
}

document.getElementById('formFinalizar').onsubmit = function(e) {
  e.preventDefault();
  if(!demandaEditando) return;

  const novoCodigo = document.getElementById('modCodigo').value.trim();

  // Impede duplicar código com outra demanda existente
  const conflito = STATE.demandas.find(d => d.codigo === novoCodigo && d.id !== demandaEditando.id);
  if (conflito) {
    alert(`Já existe outra demanda com o código "${novoCodigo}". Escolha um código diferente.`);
    return;
  }

  demandaEditando.codigo = novoCodigo;
  demandaEditando.nome = document.getElementById('modNome').value.trim();
  demandaEditando.tipo = document.getElementById('modTipo').value;
  demandaEditando.setorSolicitante = document.getElementById('modSetorSolicitante').value;
  demandaEditando.setorResponsavel = document.getElementById('modSetorResponsavel').value;
  demandaEditando.dataChegada = document.getElementById('modDataChegada').value;

  const respVal = document.getElementById('modResponsavel').value;
  const dataFimVal = document.getElementById('modDataFim').value;
  const tempoVal = document.getElementById('modTempo').value;

  demandaEditando.responsavel = respVal || '';
  demandaEditando.dataFim = dataFimVal || '';
  demandaEditando.tempoGasto = (tempoVal !== '' && !isNaN(parseFloat(tempoVal))) ? parseFloat(tempoVal) : null;

  saveState();
  fecharModal();
  render();
}

window.deleteDemanda = function(id) {
  if(confirm('Excluir esta demanda?')) {
    STATE.demandas = STATE.demandas.filter(d => d.id !== id);
    saveState();
    render();
  }
};

function formatDate(dateString) {
  if(!dateString) return '-';
  const parts = dateString.split('-');
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

// ---------- ABA 2: DASHBOARD ----------
function renderDashboardTab() {
  contentEl.innerHTML = `
    <div class="section">
      <div class="section-title"><span class="bar"></span>Análise de Demandas</div>
      <div class="charts-grid">
        <div class="chart-container full-width">
          <div class="chart-title">Demandas Concluídas por Período (Mês)</div>
          <canvas id="chartEvolucao"></canvas>
        </div>
        <div class="chart-container">
          <div class="chart-title">Distribuição por Tipo de Demanda</div>
          <canvas id="chartTipos"></canvas>
        </div>
        <div class="chart-container">
          <div class="chart-title">Tempo Gasto por Setor Solicitante (Horas)</div>
          <canvas id="chartSetores"></canvas>
        </div>
      </div>
    </div>
  `;

  // Renderiza os gráficos logo após injetar o HTML
  setTimeout(() => {
    const finalizadas = STATE.demandas.filter(d => d.dataFim && d.tempoGasto !== null);
    const themeColors = ['#122c4f', '#a83232', '#e0a83e', '#5b8fc9', '#2f8f5b', '#6b7480', '#1b2430'];

    // 1. Gráfico de Evolução (Linha)
    const evolucaoData = {};
    finalizadas.forEach(d => {
      const mesAno = d.dataFim.substring(0, 7);
      evolucaoData[mesAno] = (evolucaoData[mesAno] || 0) + 1;
    });
    const evolucaoLabels = Object.keys(evolucaoData).sort();
    
    charts.evolucao = new Chart(document.getElementById('chartEvolucao'), {
      type: 'line',
      data: {
        labels: evolucaoLabels,
        datasets: [{
          label: 'Demandas Finalizadas',
          data: evolucaoLabels.map(l => evolucaoData[l]),
          borderColor: '#a83232',
          backgroundColor: 'rgba(168, 50, 50, 0.1)',
          fill: true,
          tension: 0.3,
          borderWidth: 2
        }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });

    // 2. Gráfico por Tipos (Doughnut)
    const tiposData = {};
    STATE.demandas.forEach(d => {
      tiposData[d.tipo] = (tiposData[d.tipo] || 0) + 1;
    });
    
    charts.tipos = new Chart(document.getElementById('chartTipos'), {
      type: 'doughnut',
      data: {
        labels: Object.keys(tiposData),
        datasets: [{
          data: Object.values(tiposData),
          backgroundColor: themeColors
        }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });

    // 3. Gráfico de Tempo por Setor (Barra)
    const setoresData = {};
    finalizadas.forEach(d => {
      setoresData[d.setorSolicitante] = (setoresData[d.setorSolicitante] || 0) + parseFloat(d.tempoGasto);
    });
    
    charts.setores = new Chart(document.getElementById('chartSetores'), {
      type: 'bar',
      data: {
        labels: Object.keys(setoresData),
        datasets: [{
          label: 'Horas Totais',
          data: Object.values(setoresData),
          backgroundColor: '#122c4f'
        }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }, 100);
}

// ---------- ABA 3: PARÂMETROS ----------
function renderConfigTab() {
  const renderCardConfig = (titulo, key) => `
    <div class="card">
      <div class="section-title"><span class="bar"></span>${titulo}</div>
      <div style="display:flex; gap:10px; margin-bottom:12px;">
        <input type="text" id="inpNew_${key}" class="input-text" placeholder="Adicionar novo...">
        <button class="btn-add" onclick="addConfig('${key}')">Adicionar</button>
      </div>
      <ul class="config-list">
        ${STATE[key].length === 0 ? '<li style="color:var(--text-muted);">Nenhum item configurado.</li>' : ''}
        ${STATE[key].map((item, index) => `
          <li>
            <span>${item}</span>
            <button class="btn-delete" onclick="removeConfig('${key}', ${index})">Remover</button>
          </li>
        `).join('')}
      </ul>

  `;

  contentEl.innerHTML = `
    <div class="section">
      <div class="form-grid" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));">
        ${renderCardConfig('Tipos de Demanda', 'tipos')}
        ${renderCardConfig('Setores Solicitantes', 'setoresSolicitantes')}
        ${renderCardConfig('Setores Responsáveis', 'setoresResponsaveis')}
        ${renderCardConfig('Pessoas Responsáveis', 'responsaveis')}
      </div>
    </div>
  `;
}

window.addConfig = function(key) {
  const inputEl = document.getElementById(`inpNew_${key}`);
  const valor = inputEl.value.trim();
  
  if (valor && !STATE[key].includes(valor)) {
    STATE[key].push(valor);
    saveState();
    render();
  } else if (STATE[key].includes(valor)) {
    alert('Este item já está cadastrado.');
  }
};

window.removeConfig = function(key, index) {
  if (confirm('Tem certeza que deseja remover este item?')) {
    STATE[key].splice(index, 1);
    saveState();
    render();
  }
};

// ---------- IMPORTAR / EXPORTAR PLANILHA ----------
function parseFlexibleDate(value) {
  if (value === undefined || value === null || value === '') return '';

  // Já veio como objeto Date (o SheetJS converte datas do Excel quando cellDates:true)
  if (value instanceof Date && !isNaN(value)) {
    const y = value.getFullYear();
    const m = String(value.getMonth() + 1).padStart(2, '0');
    const d = String(value.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  // Número serial de data do Excel (fallback, caso cellDates não converta)
  if (typeof value === 'number') {
    const parsed = XLSX.SSF.parse_date_code(value);
    if (parsed) {
      const y = parsed.y, m = String(parsed.m).padStart(2, '0'), d = String(parsed.d).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
    return '';
  }

  const str = String(value).trim();
  if (!str) return '';

  // Formato AAAA-MM-DD (já no padrão do input date)
  if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;

  // Formato DD/MM/AAAA ou DD-MM-AAAA
  const match = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (match) {
    const d = match[1].padStart(2, '0'), m = match[2].padStart(2, '0'), y = match[3];
    return `${y}-${m}-${d}`;
  }

  return '';
}

function exportarPlanilha() {
  const dados = STATE.demandas.map(d => ({
    'Código': d.codigo,
    'Nome': d.nome,
    'Tipo': d.tipo,
    'Setor Solicitante': d.setorSolicitante,
    'Setor Responsável': d.setorResponsavel,
    'Responsável': d.responsavel || '',
    'Data Chegada': d.dataChegada || '',
    'Data Fim': d.dataFim || '',
    'Tempo Gasto (h)': (d.tempoGasto !== null && d.tempoGasto !== undefined) ? d.tempoGasto : ''
  }));

  const ws = XLSX.utils.json_to_sheet(dados);
  ws['!cols'] = [
    { wch: 12 }, { wch: 35 }, { wch: 22 }, { wch: 18 },
    { wch: 18 }, { wch: 16 }, { wch: 14 }, { wch: 14 }, { wch: 14 }
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Demandas');

  const dataAtual = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, `demandas_milplan_${dataAtual}.xlsx`);
}

function importarPlanilha(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array', cellDates: true });
      const sheetName = wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '' });

      if (rows.length === 0) {
        alert('A planilha selecionada está vazia.');
        return;
      }

      let novos = 0, atualizados = 0;

      rows.forEach(row => {
        const codigo = String(row['Código'] || row['Codigo'] || '').trim() || `REQ-${Date.now().toString().slice(-6)}-${Math.floor(Math.random()*90+10)}`;
        const nome = String(row['Nome'] || row['Descrição'] || row['Descricao'] || '').trim();
        const tipo = String(row['Tipo'] || '').trim();
        const setorSolicitante = String(row['Setor Solicitante'] || '').trim();
        const setorResponsavel = String(row['Setor Responsável'] || row['Setor Responsavel'] || '').trim();
        const responsavel = String(row['Responsável'] || row['Responsavel'] || '').trim();
        const dataChegada = parseFlexibleDate(row['Data Chegada']);
        const dataFim = parseFlexibleDate(row['Data Fim']);

        const tempoRaw = row['Tempo Gasto (h)'] !== undefined ? row['Tempo Gasto (h)'] : row['Tempo Gasto'];
        const tempoGasto = (tempoRaw !== '' && tempoRaw !== undefined && !isNaN(parseFloat(tempoRaw)))
          ? parseFloat(tempoRaw) : null;

        // Cadastra automaticamente novos tipos/setores/responsáveis nos parâmetros, se ainda não existirem
        if (tipo && !STATE.tipos.includes(tipo)) STATE.tipos.push(tipo);
        if (setorSolicitante && !STATE.setoresSolicitantes.includes(setorSolicitante)) STATE.setoresSolicitantes.push(setorSolicitante);
        if (setorResponsavel && !STATE.setoresResponsaveis.includes(setorResponsavel)) STATE.setoresResponsaveis.push(setorResponsavel);
        if (responsavel && !STATE.responsaveis.includes(responsavel)) STATE.responsaveis.push(responsavel);

        const demandaData = { codigo, nome, tipo, setorSolicitante, setorResponsavel, responsavel, dataChegada, dataFim, tempoGasto };
        const existente = STATE.demandas.find(d => d.codigo === codigo);

        if (existente) {
          Object.assign(existente, demandaData);
          atualizados++;
        } else {
          STATE.demandas.push({ id: Math.random().toString(36).substr(2, 9), ...demandaData });
          novos++;
        }
      });

      saveState();
      render();
      alert(`Importação concluída!\n${novos} demanda(s) nova(s) criada(s).\n${atualizados} demanda(s) atualizada(s) (pelo Código).`);
    } catch (err) {
      alert('Erro ao importar a planilha. Verifique se o arquivo está no formato correto.\n' + err.message);
    } finally {
      event.target.value = '';
    }
  };
  reader.readAsArrayBuffer(file);
}
